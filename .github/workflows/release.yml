#
# One release per tag. The tag names the version the binaries report; the
# release carries prebuilt archives for Linux, macOS and Windows plus a
# checksum file. Nothing is code-signed: macOS and Windows builds are
# unverified by anyone yet, and a signature would not change that.
#
# Linux: amd64 and arm64, built from the Ubuntu runner.
# macOS: one universal binary, two cross-builds joined with lipo.
# Windows: amd64 only; ARM desktops are untested, so they are not published.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # A tag can point at a commit that never ran on main. Repeat the checks
  # before anything is published.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go build ./...
      - run: go vet ./...
      - run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted" >&2
            exit 1
          fi
      - run: go test ./...

      - name: reuse
        run: pipx run reuse lint

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            archive: tar
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            archive: tar
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
            archive: zip
          - os: macos-latest
            goos: darwin
            goarch: universal
            archive: tar
    runs-on: ${{ matrix.os }}
    env:
      # Only the version and the archive kind are job-wide. GOOS/GOARCH are
      # not: setup-go runs `go env` before the build, and "universal" is not a
      # GOARCH it accepts.
      VERSION: ${{ github.ref_name }}
      TARGET_OS: ${{ matrix.goos }}
      TARGET_ARCH: ${{ matrix.goarch }}
      ARCHIVE: ${{ matrix.archive }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        shell: bash
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          goos="$TARGET_OS"
          goarch="$TARGET_ARCH"
          ext=""
          if [ "$goos" = windows ]; then ext=".exe"; fi
          flags=(-trimpath -ldflags "-s -w -X github.com/YangtseSu/goTrust/internal/version.Version=$version")
          # A GUI-subsystem Windows binary opens no console window. The CLI
          # keeps its console so its output is visible.
          gui_flags=("${flags[@]}")
          if [ "$goos" = windows ]; then
            gui_flags=(-trimpath -ldflags "-s -w -H windowsgui -X github.com/YangtseSu/goTrust/internal/version.Version=$version")
          fi

          mkdir -p build dist
          if [ "$goarch" = universal ]; then
            for arch in amd64 arm64; do
              GOOS="$goos" GOARCH="$arch" CGO_ENABLED=0 go build "${gui_flags[@]}" -o "build/gotrust-$arch" ./cmd/gotrust
              GOOS="$goos" GOARCH="$arch" CGO_ENABLED=0 go build "${flags[@]}" -o "build/gotrust-cli-$arch" ./cmd/gotrust-cli
            done
            lipo -create build/gotrust-amd64 build/gotrust-arm64 -output "build/gotrust$ext"
            lipo -create build/gotrust-cli-amd64 build/gotrust-cli-arm64 -output "build/gotrust-cli$ext"
          else
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build "${gui_flags[@]}" -o "build/gotrust$ext" ./cmd/gotrust
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build "${flags[@]}" -o "build/gotrust-cli$ext" ./cmd/gotrust-cli
          fi

          gui_root="gotrust_${version}_${goos}_${goarch}"
          cli_root="gotrust-cli_${version}_${goos}_${goarch}"
          mkdir -p "dist/$gui_root" "dist/$cli_root"
          cp "build/gotrust$ext" LICENSE "dist/$gui_root/"
          cp "build/gotrust-cli$ext" LICENSE "dist/$cli_root/"
          # The desktop entry and the icons belong to the Linux archive: a
          # package installs them, and a tarball should carry the same files.
          if [ "$goos" = linux ]; then
            mkdir -p "dist/$gui_root/data"
            cp -r data/gotrust.desktop data/icons "dist/$gui_root/data/"
          fi

          if [ "$ARCHIVE" = zip ]; then
            (cd dist && zip -qr "$gui_root.zip" "$gui_root" && zip -qr "$cli_root.zip" "$cli_root")
          else
            (cd dist && tar -czf "$gui_root.tar.gz" "$gui_root" && tar -czf "$cli_root.tar.gz" "$cli_root")
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}-zip
          path: dist/*.zip
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # gh reads the repository and the tag from a checkout; without one it
      # fails before it talks to the API.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "goTrust $GITHUB_REF_NAME" \
            dist/*
